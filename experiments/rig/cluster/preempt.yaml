# The preemptor: it asks for more than either node has left, so the scheduler must remove a victim.
# One pod per node, so the two arms are preempted independently and in the same way — the fault is the
# platform's decision, not a script killing processes.
apiVersion: v1
kind: Pod
metadata:
  name: preempt-governed
  namespace: ckpt-exp
spec:
  priorityClassName: ckpt-high
  nodeSelector:
    arm: governed
  restartPolicy: Never
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sleep", "120"]
      resources:
        requests: {cpu: "13", memory: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: preempt-naive
  namespace: ckpt-exp
spec:
  priorityClassName: ckpt-high
  nodeSelector:
    arm: naive
  restartPolicy: Never
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sleep", "120"]
      resources:
        requests: {cpu: "13", memory: 1Gi}
